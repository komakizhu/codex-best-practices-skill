          `继续调查`

          > 你认为证据还不够。Codex 会继续只读调查，不会修改文件。

          `继续聊聊`

          > 你想继续讨论调查结果。Codex 会保留当前证据，不会进入修复或修改文件。

          `取消`

          > 你要停止当前任务。Codex 不会继续调查或修改文件。

  - name: option selection returns to the existing route
    expected: pass
    events:
      - actor: user
        text: "$option-explorer 比较两条有成本差异的技术路线"
      - actor: assistant
        channel: main
        reply_state: waiting
        awaits_user: true
        turn_end: true
        text: |
          **结论：当前存在两个值得比较的技术方向，Codex 先等待你进入 Option。**

          **已完成：**
          Codex 已经确认两个方向的实现成本和回滚风险不同，且当前没有明显赢家。

          **下一步：**
          你选择进入 Option 后，Codex 会比较证据、取舍和不确定性；当前不会修改文件。

          **怎么回复：**
          `进入 option`

          > 你同意进入 Option。Codex 会比较两个方向，不会直接修改文件。

          `跳过 option`

          > 你不需要额外比较。Codex 会回到原有路线，不会因为跳过 Option 而修改文件。

          `继续聊聊`

          > 你暂时不进入 Option。Codex 会继续讨论方向，不会比较或修改文件。
      - actor: user
        text: "进入 option"
      - actor: assistant
        channel: main
        reply_state: waiting
        awaits_user: true
        turn_end: true
        text: |
          **结论：Option 比较已经完成，方案 A 和方案 B 的取舍如下。**

          **已完成：**
          Codex 已经比较两个方向的证据、成本、风险和回滚方式，并说明了推荐理由。

          **下一步：**
          你采用一个方向后，Codex 会把选择带回原有 Route；在需要的 native Plan 和执行授权出现前，不会修改文件。

          **怎么回复：**
          `采用 A`

          > 你采用方案 A。Codex 会把方案 A 带回原有 Route，不会因此直接修改文件。

          `采用 B`

          > 你采用方案 B。Codex 会把方案 B 带回原有 Route，不会因此直接修改文件。

          `继续聊聊`

          > 你想补充其他方向或继续比较。Codex 会保留当前结果并回到讨论，不会修改文件。

          `取消`

          > 你要停止 Option。Codex 不会选择方案、进入 Plan 或修改文件。
      - actor: user
        text: "采用 A"
      - actor: assistant
        channel: main
        reply_state: progress
        continues: true
        turn_end: false
        text: |
          **结论：方案 A 已被采用，Codex 正在把它带回原有 Route。**

          **已完成：**
          你已经明确采用方案 A，Codex 已记录这项选择。

          **下一步：**
          Codex 正在按原有 Route 准备后续 Plan，当前不会修改文件。
      - actor: tool
        channel: main
        tool_name: rg
        write: false
        text: "读取原有 Route 的后续 Plan 入口"

