---
cases:
  - name: task-brief confirmation returns to Route
    expected: pass
    events:
      - actor: user
        text: "$task-brief 请整理这个修复任务"
      - actor: assistant
        text: |
          **目标：整理修复任务。**

          **当前上下文/证据：**
          Codex 已经把当前请求、现有证据和仓库范围整理成 Brief 草案。

          **约束与授权：**
          当前只等待 Brief 确认；Codex 不会修改文件，也不会因整理 Brief 获得实施权限。

          **范围/非目标：**
          只处理当前修复任务的定义，不在 Brief 阶段调用 Route、Plan 或实施。

          **验收标准/待确认项：**
          用户可以确认这份 Brief；下一步由你确认摘要，你确认后 Codex 会展示 Route，但后续授权前不会修改文件。

          请确认这份任务摘要。

          `确认`

          > 你同意这份任务摘要。Codex 接下来会判断 Route，不会修改文件。

          `修改：请把……改成……`

          > 你不同意当前摘要。Codex 会按你的说明重新整理 Brief，不会修改文件。

          `先聊一聊`

          > 你暂时不确认这份任务摘要。Codex 会保留未确认草案并继续讨论，不会修改文件。

          `取消`

          > 你要停止当前任务。Codex 不会继续路由、规划或实施。
      - actor: user
        text: "确认"
      - actor: assistant
        text: |
          **结论：Route 已生成，Codex 接下来先做只读调查。**

          **已完成：**
          Brief 已确认。

          **下一步：**
          你确认 Route 后，Codex 会开始调查，不会修改文件。

          **怎么回复：**
          `确认路由`

          > 你同意这条 Route。Codex 接下来开始只读调查，不会修改文件。

          `修改：请调整调查范围`

          > 你要修改当前 Route。Codex 会按你的说明重新整理 Route，不会开始调查或修改文件。

          `继续聊聊`

          > 你暂时不确认 Route。Codex 会继续讨论，不会调查或修改文件。

          `取消`

          > 你要停止当前任务。Codex 不会继续调查或修改文件。

  - name: plan-only result has an execution handoff
    expected: pass
    events:
      - actor: user
        text: "$task-router 只制定方案，不修改文件"
      - actor: assistant
        text: |
          **结论：Route 确认后只制定 Plan，不会修改文件。**

          **已完成：**
          Codex 已经确认当前任务使用 `plan-only` 模式。

          **下一步：**
          你确认 Route 后，Codex 会制定 Plan，不会修改文件。

          **怎么回复：**
          `确认路由`

          > 你同意这条 Route。Codex 接下来制定 Plan，不会修改文件。

          `修改：请调整任务范围`

          > 你要修改当前 Route。Codex 会重新整理 Route，不会制定 Plan 或修改文件。

          `继续聊聊`

          > 你暂时不确认这条 Route。Codex 会继续讨论，不会制定 Plan 或修改文件。

          `取消`

          > 你要停止当前任务。Codex 不会继续规划或执行。
      - actor: user
        text: "确认路由"
      - actor: assistant
        mode: plan-only
        native_plan: true
        write: false
        text: |
          **结论：这份 Plan 已完成；本轮只做规划，不会修改文件。**

          **已完成：**
          Codex 已经写清方案和验证方法。

          **下一步：**
          你可以确认实施、修改 Plan、继续讨论或取消；确认执行前，Codex 不会修改文件。

          **怎么回复：**
          `确认计划，执行`

          > 你接受这份 Plan 并授权 Codex 实施。Codex 会复用这份 Plan 修改文件并运行验证。

          `修改计划`

          > 你要调整这份 Plan。Codex 会重新制定 native Plan，确认执行前不会修改文件。

          `继续聊聊`

          > 你暂时不执行这份 Plan，想继续讨论。Codex 会保留 Plan，不会修改文件。

          `取消`

          > 你要取消当前任务。Codex 不会继续规划或执行。

  - name: external Skill returns control to Workflow
    expected: pass
    events:
      - actor: user
        text: "$engineering-workflow 调用设计 Skill 了解界面问题"
      - actor: assistant
        text: |
          **结论：外部 Skill 已返回设计事实。**

          **已完成：**
          外部 Skill 保留了技术信息。

          **下一步：**
          Codex 会把这条事实交还给 Workflow，并等待你选择继续讨论还是进入 Route。

          **怎么回复：**
          `继续聊聊`

          > 你想继续讨论外部结果。Codex 会保留这些事实，不会进入 Route 或修改文件。

          `整理 brief`

          > 你要把外部事实整理进任务摘要。Codex 会生成 Brief，不会进入 Route 或修改文件。

          `取消`

          > 你要停止当前任务。Codex 不会继续处理外部结果或修改文件。
      - actor: assistant
        channel: main
        return_from: external
        text: |
          **结论：Workflow 已接住外部 Skill 的结果，准备继续 Route。**

          **已完成：**
          Workflow 已把正文改成清楚的主语和动作。

          **下一步：**
          Codex 会把结果交给 Route，继续判断后续步骤。

          **怎么回复：**
          `确认路由`

          > 你确认继续。Codex 会进入 Route，不会因为外部 Skill 返回就直接修改文件。

          `修改：请调整 Route`

          > 你要修改当前 Route。Codex 会按你的说明重新整理，不会直接修改文件。

          `继续聊聊`

          > 你暂时不进入 Route，想继续讨论。Codex 会保留外部事实，不会修改文件。

          `取消`

          > 你要停止当前任务。Codex 不会继续处理外部结果或修改文件。

