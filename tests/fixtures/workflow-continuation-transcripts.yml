  - name: discussion mode blocks file changes
    expected: pass
    assertions:
      - discussion_no_write
    events:
      - actor: user
        text: "$task-brief 请整理这个任务"
      - actor: assistant
        text: |
          **目标：整理这个任务。**

          **当前上下文/证据：**
          Codex 已经整理当前请求和已有事实，形成 Brief 草案。

          **约束与授权：**
          当前只等待 Brief 确认；Codex 不会修改文件。

          **范围/非目标：**
          只整理任务定义，不进入 Route、Plan 或实施。

          **验收标准/待确认项：**
          下一步由你确认摘要；你确认后 Codex 会展示 Route，但授权前不会修改文件。

          请确认这份任务摘要。

          `确认`

          > 你同意这份任务摘要。Codex 接下来会展示 Route，不会修改文件。

          `修改：请把……改成……`

          > 你要修改摘要。Codex 会重新整理 Brief，不会修改文件。

          `先聊一聊`

          > 你暂时不确认这份任务摘要。Codex 会保留草案并继续讨论，不会修改文件。

          `取消`

          > 你要停止当前任务。Codex 不会继续讨论或修改文件。
      - actor: user
        text: "先聊一聊"
      - actor: assistant
        mode: discussion
        write: false
        text: |
          **结论：我们现在继续讨论，不更新 Brief，也不修改文件。**

          **已完成：**
          Codex 已经保留当前 Brief 草案，并记录了你刚补充的想法。

          **下一步：**
          你可以继续补充，也可以让我重新整理 Brief。

          **怎么回复：**
          `继续聊聊`

          > 你想继续讨论。Codex 会补充分析，不会更新 Brief 或修改文件。

          `整理 brief`

          > 你要重新整理任务摘要。Codex 会生成新的 Brief，然后再次请你确认；在此之前不会修改文件。

          `取消`

          > 你要停止当前任务。Codex 不会继续讨论或修改文件。

  - name: side handoff returns to Workflow card
    expected: pass
