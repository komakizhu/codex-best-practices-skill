interface:
  display_name: "Option Explorer"
  short_description: "Compare high-cost engineering paths when no clear winner exists"
  default_prompt: "Use $option-explorer after the trigger is shown and 进入 option is selected, or enter the Workflow at Option when invoked directly; after exploration, send the selected direction directly to native Plan or the filled manual Plan request across reply turns without a duplicate entry gate. Every visible reply must state the conclusion, completed comparison, next actor/action, standalone command or host action, consequence, and current no-write boundary. After 继续聊聊, pause writes and re-check authorization; rewrap SIDE-HANDOFF facts in the Option handoff. Keep Option and Plan as fixed terms, explain trade-offs in concrete Chinese, and avoid mechanically translated noun chains."
policy:
  allow_implicit_invocation: false
