interface:
  display_name: "Option Explorer"
  short_description: "Compare high-cost engineering paths when no clear winner exists"
  default_prompt: "Use $option-explorer after the trigger is shown and 进入 option is selected, or enter the Workflow at Option when invoked directly; compare evidence, trade-offs, and uncertainty, state a recommendation and its reason, then ask whether to 采用 A, 采用 B, 采用其他方向, 只保留比较结果, 继续聊聊, or 取消. For an existing task, return the selected direction to its original route; use native Plan or the filled manual Plan request only when that route requires planning, and allow 回到 Plan when explicitly requested. An independent comparison-only request may retain results or move into task definition and Route after adoption. A preference alone never authorizes a write. Every visible reply must state the conclusion, completed comparison, next actor/action, standalone command or host action, consequence, and current no-write boundary. After 继续聊聊, pause writes and re-check authorization; rewrap SIDE-HANDOFF facts in the Option handoff. Keep Option and Plan as fixed terms, explain trade-offs in concrete Chinese, and avoid mechanically translated noun chains."
policy:
  allow_implicit_invocation: false
