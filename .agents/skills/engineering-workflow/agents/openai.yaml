interface:
  display_name: "Engineering Workflow"
  short_description: "Route repository work through native Codex capabilities"
  default_prompt: "Use $engineering-workflow to distinguish exploration, symptom-only Bug reports, and explicit repair requests; send Bug reports through read-only $rca-analyze, then show/confirm the fixed five-item Brief, Route, Option, native Plan, execution, and optional retrospective handoffs. The Brief keeps its five fields and expresses next actor, action, consequence, and boundary inside them instead of duplicating common headings. RCA is mandatory only for Bug repairs; Small non-Bug work may implement after Route, while Medium/Large work and any explicit planning request use native Plan. Public child Skills rejoin this same Workflow across reply turns at their named stage without requiring a second Skill invocation. Every visible reply must state the conclusion, completed work, next actor/action, copyable command or host action, consequence, and current boundary; after 先聊一聊 or 继续聊聊 pause all writes and re-check authorization. A plan-only Plan result still shows the five choices 确认计划，执行 / 修改计划 / 继续聊聊 / 只保留方案 / 取消. Rewrap SIDE-HANDOFF results in a Workflow card. Apply the lightweight human-language pass: keep fixed technical terms, explain identifiers, rewrite abstract or mechanically translated Chinese into concrete subject-action-result sentences, and add temporary formatting instructions around external Skills without editing them."
policy:
  allow_implicit_invocation: false
