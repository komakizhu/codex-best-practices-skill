interface:
  display_name: "Engineering Workflow"
  short_description: "Route repository work through native Codex capabilities"
  default_prompt: "Use $engineering-workflow to distinguish exploration, symptom-only Bug reports, and explicit repair requests; send Bug reports through read-only $rca-analyze, then show/confirm the fixed five-item Brief, Route, Option, native Plan, execution, and optional retrospective handoffs. The Brief keeps its five fields and expresses next actor, action, consequence, and boundary inside them instead of duplicating common headings. RCA is mandatory only for Bug repairs; Small non-Bug work may implement after Route, while Medium/Large work and any explicit planning request use native Plan. Public child Skills rejoin this same Workflow across reply turns at their named stage without requiring a second Skill invocation. Every visible reply must state the conclusion, completed work, next actor/action, consequence, and current boundary. Waiting cards show 3–4 distinct context-relevant choices; progress replies state the action Codex is currently performing and do not ask the user to reply. For environment preparation, show `已就绪`, `继续聊聊`, and `取消`; after `已就绪`, continue the actual read-only action without a duplicate confirmation. After 先聊一聊 or 继续聊聊 pause all writes and re-check authorization. A plan-only Plan result shows 确认计划，执行 / 修改计划 / 继续聊聊 / 取消; `执行` is accepted only as an input alias when a visible Plan is waiting for execution authorization and is never displayed as a second choice. Rewrap SIDE-HANDOFF results in a Workflow card. Apply the lightweight human-language pass: keep fixed technical terms, explain identifiers, rewrite abstract or mechanically translated Chinese into concrete subject-action-result sentences, and add temporary formatting instructions around external Skills without editing them."
policy:
  allow_implicit_invocation: false
