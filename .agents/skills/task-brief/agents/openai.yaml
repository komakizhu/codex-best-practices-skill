interface:
  display_name: "Task Brief"
  short_description: "Turn scattered repository requests into concise task definitions"
  default_prompt: "Use $task-brief only for action-ready work or after local exploration returns and the user says 整理 brief; produce one five-item snapshot, then tell the user to reply 确认, 修改：..., 先聊一聊, or 取消 before routing. Do not run in parallel with exploration or live-update a brief."
policy:
  allow_implicit_invocation: false
