interface:
  display_name: "Task Brief"
  short_description: "Turn scattered repository requests into concise task definitions"
  default_prompt: "Use $task-brief for action-ready work or after local exploration returns and the user says 整理 brief; produce one fixed five-item snapshot in the order 目标 / 当前上下文/证据 / 约束与授权 / 范围/非目标 / 验收标准/待确认项. Keep next actor, consequence, and no-write boundary in the fifth item and confirmation choices instead of adding common headings. Then tell the user to reply 确认, 修改：..., 先聊一聊, or 取消. A confirmed direct Brief continues to the visible Route card across reply turns unless the user explicitly asks for a standalone Brief. Every visible reply must include a conclusion, completed work, next actor/action, a standalone command or host action, and the current boundary. After 先聊一聊 or 继续聊聊, pause all writes and re-check authorization; rewrap SIDE-HANDOFF facts in the Brief handoff instead of changing it directly. Do not run in parallel with exploration or live-update a brief. Keep Brief as the fixed term, but explain identifiers, rewrite abstract noun chains into plain subject-action-result Chinese, and use temporary formatting instructions for any external Skill without editing it."
policy:
  allow_implicit_invocation: false
