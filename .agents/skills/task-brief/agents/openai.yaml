interface:
  display_name: "Task Brief"
  short_description: "Turn scattered repository requests into concise task definitions"
  default_prompt: "Use $task-brief for action-ready work or after local exploration returns and the user says 整理 brief; produce one five-item snapshot, then tell the user to reply 确认, 修改：..., 先聊一聊, or 取消. A confirmed direct Brief continues to Route unless the user explicitly asks for a standalone Brief. Do not run in parallel with exploration or live-update a brief. Keep Brief as the fixed term, but explain identifiers and rewrite abstract noun chains into plain subject-action-result Chinese."
policy:
  allow_implicit_invocation: false
