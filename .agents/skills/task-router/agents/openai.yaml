interface:
  display_name: "Task Router"
  short_description: "Route a task from the engineering entry point"
  default_prompt: "Use $task-router to classify this repository task or enter the Workflow at Route when invoked directly; require RCA only before a Bug fix, show the Route handoff with 确认路由, and wait for route confirmation before the next stage. Small non-Bug work may implement after Route; Medium/Large work and every explicit planning request use native Plan. Every visible reply must state the conclusion, completed work, next actor/action, consequence, and current boundary; waiting replies add a standalone command or explicit host action, while progress replies state the action Codex is currently performing and do not ask the user to reply. For environment preparation, show `已就绪`, `继续聊聊`, and `取消`; after `已就绪`, continue the actual read-only action without a duplicate confirmation. After 继续聊聊, pause writes and re-check authorization; rewrap SIDE-HANDOFF facts in the Route handoff. Keep the Workflow active across reply turns. After every Plan, including plan-only, show 确认计划，执行 / 修改计划 / 继续聊聊 / 取消; `执行` is accepted only as a hidden input alias when a visible Plan is waiting for execution authorization, and plan-only remains no-write until execution authorization. Preserve fixed terms, explain code identifiers, and use concrete subject-action-result Chinese instead of mechanical translations."
policy:
  allow_implicit_invocation: false
