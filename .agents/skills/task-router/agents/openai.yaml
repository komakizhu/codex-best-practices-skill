interface:
  display_name: "Task Router"
  short_description: "Route a task from the engineering entry point"
  default_prompt: "Use $task-router to classify this repository task or enter the Workflow at Route when invoked directly; require RCA only before a Bug fix, show the Route handoff with 确认路由, and wait for route confirmation before the next stage. Small non-Bug work may implement after Route; Medium/Large work and every explicit planning request use native Plan. Every visible reply must state the conclusion, completed work, next actor/action, standalone command or host action, consequence, and current boundary. After 继续聊聊, pause writes and re-check authorization; rewrap SIDE-HANDOFF facts in the Route handoff. Keep the Workflow active across reply turns. After every Plan, including plan-only, show 确认计划，执行 / 修改计划 / 继续聊聊 / 只保留方案 / 取消; plan-only remains no-write until execution authorization. Preserve fixed terms, explain code identifiers, and use concrete subject-action-result Chinese instead of mechanical translations."
policy:
  allow_implicit_invocation: false
