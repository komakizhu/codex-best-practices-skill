interface:
  display_name: "Task Router"
  short_description: "Route a task from the engineering entry point"
  default_prompt: "Use $task-router to classify this repository task or enter the Workflow at Route when invoked directly; require RCA before any Bug fix, show the Route handoff with 确认路由, and wait for route confirmation before the next stage. Every visible reply must state the conclusion, completed work, next actor/action, standalone command or host action, consequence, and current boundary. After 继续聊聊, pause writes and re-check authorization; rewrap SIDE-HANDOFF facts in the Route handoff. Keep the Workflow active across reply turns, give plan-only a four-command planning-end handoff, preserve fixed terms, explain code identifiers, and use concrete subject-action-result Chinese instead of mechanical translations."
policy:
  allow_implicit_invocation: false
