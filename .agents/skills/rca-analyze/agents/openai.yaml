interface:
  display_name: "RCA Analyze"
  short_description: "Find and scope bug root causes before repair"
  default_prompt: "Use $rca-analyze for a symptom-only bug report or explicit RCA request; build a red-capable reproduction, trace the source, classify Small or Large RCA, and return a clear handoff to 整理 brief, 只保留结论, or continued read-only investigation before any repair. Every visible reply must state the conclusion, completed evidence, next actor/action, standalone command or host action, consequence, and no-write boundary. After 继续聊聊, pause writes and re-check authorization; rewrap SIDE-HANDOFF facts before returning to Brief. Keep RCA and code identifiers, explain what each identifier does, continue directly to Brief after 整理 brief across reply turns, and rewrite abstract or mechanically translated Chinese into clear subject-action-result sentences."
policy:
  allow_implicit_invocation: false
