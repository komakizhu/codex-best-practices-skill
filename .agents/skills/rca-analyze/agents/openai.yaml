interface:
  display_name: "RCA Analyze"
  short_description: "Find and scope bug root causes before repair"
  default_prompt: "Use $rca-analyze for a symptom-only bug report or explicit RCA request; build a red-capable reproduction, trace the source, classify Small or Large RCA, and return a clear handoff before any repair. If RCA came from a confirmed Bug-fix Route, return findings to that Route without repeating an unchanged Brief; Small resumes focused implementation after confirmed cause, while Medium/Large proceeds to native Plan. If invoked directly, offer 整理 brief, 继续调查, 继续聊聊, and 取消. Every visible reply must state the conclusion, completed evidence, next actor/action, consequence, and no-write boundary; waiting replies add a standalone command or explicit host action, while progress replies state the action Codex is currently performing and do not ask the user to reply. For environment preparation, show `已就绪`, `继续聊聊`, and `取消`; after `已就绪`, continue the actual read-only action without a duplicate confirmation. After 继续聊聊, pause writes and re-check authorization; rewrap SIDE-HANDOFF facts before returning to the correct parent card. Keep RCA and code identifiers, explain what each identifier does, and rewrite abstract or mechanically translated Chinese into clear subject-action-result sentences."
policy:
  allow_implicit_invocation: false
